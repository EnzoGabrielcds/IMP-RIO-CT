erto que a largura dos ombros e aproxime as escápulas.","Desça a barra com controle até a altura do meio do peito.","Empurre de volta, mantendo os punhos alinhados sobre os cotovelos."],mistakes:["Quicar a barra no peito para ganhar impulso.","Tirar o quadril do banco durante a subida.","Abrir os cotovelos a 90° do tronco."],cautions:["Com cargas altas, treine com alguém de apoio ou use as travas de segurança.","Desconforto no ombro é sinal para ajustar a pegada e a amplitude com o professor."]},{id:"supino-inclinado-halteres",name:"Supino inclinado com halteres",group:"Peitoral",secondary:["Deltoide anterior","Tríceps"],equipment:"Halteres",type:"Multiarticular",goals:["Hipertrofia","Iniciantes"],description:"Variação com o banco inclinado, que dá mais ênfase à parte superior do peitoral. Os halteres permitem um caminho mais natural para cada braço.",execution:["Ajuste o banco entre 30° e 45° de inclinação.","Com os halteres na altura do peito, mantenha as escápulas encaixadas no banco.","Empurre os halteres para cima, aproximando-os sem bater um no outro.","Desça devagar até sentir o alongamento do peitoral."],mistakes:["Inclinar demais o banco, transferindo o trabalho para os ombros.","Deixar os halteres caírem rápido na descida."],cautions:["Para subir e descer os halteres do banco, apoie-os nas coxas antes de deitar."]},{id:"voador",name:"Crucifixo na máquina (voador)",group:"Peitoral",secondary:["Deltoide anterior"],equipment:"Máquina",type:"Monoarticular",goals:["Hipertrofia","Iniciantes"],description:"Exercício de isolamento do peitoral com trajetória guiada. Bom para aprender a sentir o músculo trabalhando.",execution:["Ajuste o banco para que as pegadas fiquem na altura do peito.","Mantenha os cotovelos levemente flexionados durante todo o movimento.","Feche os braços à frente do corpo, contraindo o peitoral.","Volte devagar até sentir o alongamento, sem passar da linha dos ombros."],mistakes:["Usar o embalo do tronco para fechar os braços.","Abrir demais aits:[{title:"Poucas repetições",text:"Séries mais curtas e pesadas, geralmente entre 1 e 6 repetições."},{title:"Descanso longo",text:"Intervalos de 2 a 5 minutos para recuperar entre as séries."},{title:"Movimentos base",text:"Agachamento, supino, remada e levantamentos como centro do treino."},{title:"Técnica",text:"Quanto maior a carga, mais a execução importa. Sempre com supervisão."}],exercises:["agachamento-livre","supino-reto-barra","remada-curvada","stiff","barra-fixa","desenvolvimento-halteres"],week:[{day:"Seg",focus:"Superior · pesado"},{day:"Ter",focus:"Inferior · pesado"},{day:"Qua",focus:"Descanso",rest:!0},{day:"Qui",focus:"Superior · moderado"},{day:"Sex",focus:"Inferior · moderado"},{day:"Sáb",focus:"Descanso",rest:!0},{day:"Dom",focus:"Descanso",rest:!0}],recovery:["O sistema nervoso também cansa: semanas mais leves fazem parte do plano.","Aquecimento progressivo antes das séries pesadas é obrigatório.","Carga só sobe quando a técnica da carga atual está sólida."],cta:"Treinar força com orientação",whatsappMessage:"Olá! Vim pelo site e quero treinar para ganho de força na Império CT."},{id:"iniciantes",name:"Iniciantes na musculação",tagline:"O primeiro mês, sem mistério",visual:"steps",what:"Começar é aprender: os movimentos, os aparelhos, o ritmo da academia e como o seu corpo responde ao treino. Ninguém precisa chegar sabendo.",howHelps:"Nos primeiros meses, quase todo treino bem feito gera evolução. É a melhor fase para construir técnica, hábito e confiança.",traits:[{title:"Aprender o básico",text:"Poucos exercícios, repetidos até a execução ficar natural."},{title:"Corpo inteiro",text:"Treinos full body de 2 a 3 vezes por semana são um ótimo começo."},{title:"Carga moderada",text:"Terminar a série sentindo que conseguiria fazer mais algumas repetições."},{title:"Perguntar sempre",text:"Dúvida sobre um aparelho é conversa normal com o professor, não vergonha."}],exercises:["leg-press","puxada-frontal","supino-inclinado-halteres","remada-baixa
