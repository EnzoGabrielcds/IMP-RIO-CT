erto que a largura dos ombros e aproxime as escápulas.","Desça a barra com controle até a altura do meio do peito.","Empurre de volta, mantendo os punhos alinhados sobre os cotovelos."],mistakes:["Quicar a barra no peito para ganhar impulso.","Tirar o quadril do banco durante a subida.","Abrir os cotovelos a 90° do tronco."],cautions:["Com cargas altas, treine com alguém de apoio ou use as travas de segurança.","Desconforto no ombro é sinal para ajustar a pegada e a amplitude com o professor."]},{id:"supino-inclinado-halteres",name:"Supino inclinado com halteres",group:"Peitoral",secondary:["Deltoide anterior","Tríceps"],equipment:"Halteres",type:"Multiarticular",goals:["Hipertrofia","Iniciantes"],description:"Variação com o banco inclinado, que dá mais ênfase à parte superior do peitoral. Os halteres permitem um caminho mais natural para cada braço.",execution:["Ajuste o banco entre 30° e 45° de inclinação.","Com os halteres na altura do peito, mantenha as escápulas encaixadas no banco.","Empurre os halteres para cima, aproximando-os sem bater um no outro.","Desça devagar até sentir o alongamento do peitoral."],mistakes:["Inclinar demais o banco, transferindo o trabalho para os ombros.","Deixar os halteres caírem rápido na descida."],cautions:["Para subir e descer os halteres do banco, apoie-os nas coxas antes de deitar."]},{id:"voador",name:"Crucifixo na máquina (voador)",group:"Peitoral",secondary:["Deltoide anterior"],equipment:"Máquina",type:"Monoarticular",goals:["Hipertrofia","Iniciantes"],description:"Exercício de isolamento do peitoral com trajetória guiada. Bom para aprender a sentir o músculo trabalhando.",execution:["Ajuste o banco para que as pegadas fiquem na altura do peito.","Mantenha os cotovelos levemente flexionados durante todo o movimento.","Feche os braços à frente do corpo, contraindo o peitoral.","Volte devagar até sentir o alongamento, sem passar da linha dos ombros."],mistakes:["Usar o embalo do tronco para fechar os braços.","Abrir demais
